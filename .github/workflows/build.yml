name: build-ios
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project DSHPhone.xcodeproj -scheme DSHPhone \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DSHPhone.app Payload/
          zip -r DSHPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DSHPhone-unsigned.ipa
          path: DSHPhone-unsigned.ipa
