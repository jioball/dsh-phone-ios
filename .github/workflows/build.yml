name: build-ios
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    # generous limit: the 15m default killed a run that was still waiting for a runner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project DSHPhone.xcodeproj -scheme DSHPhone \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DSHPhone.app Payload/
          zip -r DSHPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DSHPhone-unsigned.ipa
          path: DSHPhone-unsigned.ipa
      - name: Publish release (direct install URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.18-build${{ github.run_number }}
          name: dsh-phone v0.5.18 (build ${{ github.run_number }})
          files: DSHPhone-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
