name: DSHPhone
options:
  bundleIdPrefix: com.samuel
  deploymentTarget:
    iOS: "16.0"
targets:
  DSHPhone:
    type: application
    platform: iOS
    sources: [DSHPhone]
    settings:
      base:
        INFOPLIST_FILE: DSHPhone/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.samuel.dshphone
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DSHPhone/DSHPhone.entitlements
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DSHPhone/Info.plist
      properties:
        CFBundleDisplayName: DSH phone
        CFBundleShortVersionString: "0.5.9"
        CFBundleVersion: "29"
        NSPhotoLibraryAddUsageDescription: "Save diagrams and images from your assistant."
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Take photos to send to your assistant."
        NSMicrophoneUsageDescription: "Talk to your assistant."
        NSPhotoLibraryUsageDescription: "Pick photos to send to your assistant."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
